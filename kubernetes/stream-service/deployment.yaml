# =============================================================================
# VibeSync — Stream Service Deployment
# =============================================================================
# Mirrors docker-compose stream-service:
#   - Per-service multi-stage Dockerfile (target: runtime)
#   - Port 8001, DATABASE_URL → streamdb
#   - /health liveness + readiness probes
#   - RollingUpdate with maxUnavailable: 0 for zero-downtime deploys
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-service
  namespace: vibesync
  labels:
    app.kubernetes.io/name: stream-service
    app.kubernetes.io/part-of: vibesync
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stream-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stream-service
        app.kubernetes.io/part-of: vibesync
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: stream-service
          image: ghcr.io/soumitra-04/vibesync-stream:latest
          ports:
            - containerPort: 8001
              protocol: TCP
          env:
            - name: PORT
              value: "8001"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/streamdb"
          # ── Health checks targeting /health endpoint ──
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
