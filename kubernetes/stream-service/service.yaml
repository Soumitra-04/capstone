# =============================================================================
# VibeSync — Stream Service ClusterIP Service
# =============================================================================
# Service name "stream-service" becomes the K8s DNS hostname.
# content-service uses this via STREAM_SERVICE_URL=http://stream-service:8001
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: stream-service
  namespace: vibesync
  labels:
    app.kubernetes.io/name: stream-service
    app.kubernetes.io/part-of: vibesync
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stream-service
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
