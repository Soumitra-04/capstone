# =============================================================================
# VibeSync — Content Service Deployment
# =============================================================================
# Mirrors docker-compose content-service:
#   - Per-service multi-stage Dockerfile (target: runtime)
#   - Port 8002, DATABASE_URL → contentdb
#   - STREAM_SERVICE_URL points to K8s DNS name of stream-service
#   - /health liveness + readiness probes
#   - RollingUpdate with maxUnavailable: 0 for zero-downtime deploys
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  namespace: vibesync
  labels:
    app.kubernetes.io/name: content-service
    app.kubernetes.io/part-of: vibesync
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: content-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: content-service
        app.kubernetes.io/part-of: vibesync
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: content-service
          image: ghcr.io/soumitra-04/vibesync-content:latest
          ports:
            - containerPort: 8002
              protocol: TCP
          env:
            - name: PORT
              value: "8002"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/contentdb"
            # ── Inter-service communication via K8s DNS ──
            - name: STREAM_SERVICE_URL
              value: "http://stream-service:8001"
          # ── Health checks targeting /health endpoint ──
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
