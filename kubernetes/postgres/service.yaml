# =============================================================================
# VibeSync — PostgreSQL ClusterIP Service
# =============================================================================
# Internal-only service. No external access needed — only app pods connect.
# Service name "postgres" becomes the DNS hostname used in DATABASE_URL.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vibesync
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: vibesync
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
