# =============================================================================
# VibeSync — PostgreSQL Credentials Secret
# =============================================================================
# ⚠️  DO NOT COMMIT REAL VALUES TO VERSION CONTROL ⚠️
# These are placeholder values for local/dev use only.
# For production, create the secret manually:
#   kubectl create secret generic postgres-credentials \
#     --namespace=vibesync \
#     --from-literal=POSTGRES_USER=<real-user> \
#     --from-literal=POSTGRES_PASSWORD=<real-password> \
#     --from-literal=SECRET_KEY=<real-jwt-secret>
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: vibesync
  labels:
    app.kubernetes.io/part-of: vibesync
    app.kubernetes.io/component: database
type: Opaque
data:
  # base64("streamops") = c3RyZWFtb3Bz
  POSTGRES_USER: c3RyZWFtb3Bz
  # base64("changeme_in_prod") = Y2hhbmdlbWVfaW5fcHJvZA==
  POSTGRES_PASSWORD: Y2hhbmdlbWVfaW5fcHJvZA==
  # base64("changeme_this_is_your_jwt_secret") = Y2hhbmdlbWVfdGhpc19pc195b3VyX2p3dF9zZWNyZXQ=
  SECRET_KEY: Y2hhbmdlbWVfdGhpc19pc195b3VyX2p3dF9zZWNyZXQ=
