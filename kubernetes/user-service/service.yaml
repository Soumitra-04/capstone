# =============================================================================
# VibeSync — User Service ClusterIP Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: vibesync
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: vibesync
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP
      name: http
