server {
    listen 80;
    server_name localhost;

    # Intercept proxy errors
    proxy_intercept_errors on;

    # Custom error page for 502, 503, 504
    error_page 502 503 504 /custom_502.html;

    location = /custom_502.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Route /api/users
    location /api/users {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://user-service:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route /api/streams
    location /api/streams {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://stream-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route /api/games
    location /api/games {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://content-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route /api/search
    location /api/search {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://content-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route /api/recommendations {
    location /api/recommendations {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://content-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default location for web server
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
