<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Offline | VibeSync</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --primary: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glow: rgba(244, 63, 94, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(244, 63, 94, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
        }

        .error-container {
            background: var(--card-bg);
            border: 1px solid rgba(244, 63, 94, 0.25);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5),
                        0 0 50px -10px var(--glow);
            backdrop-filter: blur(16px);
            animation: fadeIn 0.6s ease-out;
        }

        .icon-wrapper {
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: rgba(244, 63, 94, 0.1);
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.2);
            animation: pulse 2s infinite ease-in-out;
        }

        .icon {
            font-size: 38px;
            color: var(--primary);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 12px 0;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-muted);
            margin: 0 0 30px 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            background-color: rgba(244, 63, 94, 0.1);
            color: var(--primary);
            border: 1px solid rgba(244, 63, 94, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(244, 63, 94, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(244, 63, 94, 0.4); }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="icon-wrapper">
            <span class="icon">⚡</span>
        </div>
        <h1>System Offline</h1>
        <p>The backend services for VibeSync are temporarily unavailable. Our engineers have been alerted and are working to bring the systems back online. Please try refreshing the page shortly.</p>
        <span class="badge">
            <span class="pulse-dot"></span>
            Error 502: Bad Gateway
        </span>
    </div>
</body>
</html>
