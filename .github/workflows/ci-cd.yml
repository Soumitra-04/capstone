# =============================================================================
# VibeSync CI/CD Pipeline — Production-Grade
# =============================================================================
# Pipeline Architecture:
#   Job 1 (Quality Gate)  → Static analysis + unit tests across all services
#   Job 2 (Build & Push)  → Multi-stage Docker build + push to GHCR
#
# Design Rationale:
#   - Two-stage pipeline ensures no broken image is ever pushed to the registry.
#   - Immutable SHA tags enable deterministic rollbacks in Kubernetes.
#   - pip caching reduces cold-start build times by ~40-60%.
#   - Docker Buildx layer caching minimizes redundant image rebuilds.
# =============================================================================

name: VibeSync CI/CD Pipeline

# -----------------------------------------------------------------------------
# TRIGGER POLICY
# Runs on direct pushes to main (post-merge deployments) and on PRs targeting
# main (pre-merge validation). This dual-trigger pattern is the industry
# standard for trunk-based development workflows.
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# -----------------------------------------------------------------------------
# SECURITY PERMISSIONS
# Principle of least privilege: read-only for source code checkout, write
# access only for pushing container images to GitHub Packages (GHCR).
# -----------------------------------------------------------------------------
permissions:
  contents: read
  packages: write

# -----------------------------------------------------------------------------
# ENVIRONMENT VARIABLES
# Centralized registry and image configuration. Single source of truth avoids
# typos and ensures consistency across all jobs.
# -----------------------------------------------------------------------------
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vibesync-api

# =============================================================================
# JOB 1: QUALITY GATE — Lint & Test
# =============================================================================
# Purpose: Enforce code quality and functional correctness BEFORE any artifact
# is produced. This is the "shift-left" principle — catching defects at the
# earliest, cheapest stage of the pipeline.
#
# Failure here blocks Job 2 entirely. No broken code reaches the registry.
# =============================================================================
jobs:
  quality-gate:
    name: "🔍 Quality Gate — Lint & Test"
    runs-on: ubuntu-latest
    
    # -------------------------------------------------------------------------
    # STRATEGY: Define the services matrix. Each service is tested in the same
    # runner to minimize overhead for this simplified single-DB architecture,
    # but the matrix-like iteration keeps the workflow extensible.
    # -------------------------------------------------------------------------
    
    steps:
      # -----------------------------------------------------------------------
      # STEP 1: Source Code Checkout
      # Full history is not required for CI; shallow clone (default) is faster.
      # -----------------------------------------------------------------------
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # STEP 2: Python Runtime Setup
      # Python 3.11 is pinned for reproducibility. pip caching is enabled to
      # avoid re-downloading ~50MB of packages on every run. Cache key is
      # derived from requirements.txt hash — cache invalidates automatically
      # when dependencies change.
      # -----------------------------------------------------------------------
      - name: "🐍 Set up Python 3.11 with pip caching"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            streamops/services/stream-service/requirements.txt
            streamops/services/content-service/requirements.txt
            streamops/services/user-service/requirements.txt

      # -----------------------------------------------------------------------
      # STEP 3: Dependency Installation
      # Install from root requirements.txt (shared deps) plus pylint for
      # static analysis. The --quiet flag reduces CI log noise.
      # -----------------------------------------------------------------------
      - name: "📦 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt
          pip install --quiet pylint pytest-html

      # -----------------------------------------------------------------------
      # STEP 4: STATIC ANALYSIS — Pylint
      # Run pylint across all three service application directories.
      # --errors-only (-E) flag ensures the pipeline fails ONLY on actual
      # errors (syntax errors, import failures, undefined variables) — not on
      # style warnings. This prevents false-positive gate failures while still
      # catching genuinely broken code.
      #
      # DevOps Significance: Syntax errors caught here would otherwise surface
      # as runtime crashes in production. This is the cheapest place to find them.
      # -----------------------------------------------------------------------
      - name: "🔎 Pylint — Static Analysis (Syntax & Error Gate)"
        run: |
          echo "::group::Linting Stream Service"
          pylint --errors-only streamops/services/stream-service/app/
          echo "::endgroup::"
          
          echo "::group::Linting Content Service"
          pylint --errors-only streamops/services/content-service/app/
          echo "::endgroup::"
          
          echo "::group::Linting User Service"
          pylint --errors-only streamops/services/user-service/app/
          echo "::endgroup::"
          
          echo "✅ Static analysis passed — no syntax errors or critical issues found."

      # -----------------------------------------------------------------------
      # STEP 5: UNIT TESTS — Pytest (Stream Service)
      # Tests run against an in-memory SQLite database (configured in conftest.py).
      # The -v flag enables verbose output for clear pass/fail visibility in CI logs.
      # --tb=short keeps tracebacks concise without losing diagnostic value.
      #
      # DevOps Significance: If ANY SQLite-backed route test fails, the entire
      # pipeline halts. This is the functional correctness gate — no image is
      # built from code that can't pass its own test suite.
      # -----------------------------------------------------------------------
      - name: "🧪 Pytest — Stream Service"
        working-directory: streamops/services/stream-service
        run: |
          pytest tests/ -v --tb=short --html=report.html --self-contained-html
          echo "✅ Stream Service — all tests passed."

      # -----------------------------------------------------------------------
      # STEP 6: UNIT TESTS — Pytest (Content/Catalog Service)
      # Same isolation strategy: independent SQLite test DB, full route coverage.
      # -----------------------------------------------------------------------
      - name: "🧪 Pytest — Content Service"
        working-directory: streamops/services/content-service
        run: |
          pytest tests/ -v --tb=short --html=report.html --self-contained-html
          echo "✅ Content Service — all tests passed."

      # -----------------------------------------------------------------------
      # STEP 7: UNIT TESTS — Pytest (User Service)
      # Validates identity and auth routes. Critical path — user service
      # failures cascade to all downstream services.
      # -----------------------------------------------------------------------
      - name: "🧪 Pytest — User Service"
        working-directory: streamops/services/user-service
        run: |
          pytest tests/ -v --tb=short --html=report.html --self-contained-html
          echo "✅ User Service — all tests passed."

      # -----------------------------------------------------------------------
      # STEP 8: UPLOAD ARTIFACTS — HTML Test Reports
      # -----------------------------------------------------------------------
      - name: "📤 Upload Test Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            streamops/services/stream-service/report.html
            streamops/services/content-service/report.html
            streamops/services/user-service/report.html
          retention-days: 14

  # ===========================================================================
  # JOB 2: BUILD & PUSH — Immutable Artifact Generation
  # ===========================================================================
  # Purpose: Produce a versioned, immutable Docker image and push it to GHCR.
  # This job ONLY runs after the Quality Gate passes — enforced via `needs`.
  #
  # DevOps Significance:
  #   - Immutable tags (commit SHA) guarantee that every deployment can be
  #     traced back to an exact commit, enabling deterministic rollbacks.
  #   - The `latest` tag provides a convenience pointer for dev environments
  #     but should NEVER be used in production Kubernetes manifests.
  #   - Multi-stage Docker builds reduce the final image size by excluding
  #     build-time dependencies (compilers, dev headers, etc.).
  # ===========================================================================
  build-and-push:
    name: "🐳 Build & Push — Immutable Artifact"
    runs-on: ubuntu-latest
    needs: [quality-gate]

    # -------------------------------------------------------------------------
    # CONDITION: Only push images on main branch pushes (not on PR checks).
    # PRs validate the build but don't pollute the registry with unmerged code.
    # -------------------------------------------------------------------------
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # -----------------------------------------------------------------------
      # STEP 1: Source Code Checkout
      # Required for Docker build context.
      # -----------------------------------------------------------------------
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # STEP 2: GHCR Authentication
      # Uses the built-in GITHUB_TOKEN — no manual secret rotation required.
      # This token is scoped to the repository and auto-expires after the
      # workflow run, following zero-trust security principles.
      # -----------------------------------------------------------------------
      - name: "🔐 Authenticate to GitHub Container Registry (GHCR)"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # STEP 3: Docker Buildx Setup
      # Buildx enables advanced features:
      #   - Multi-platform builds (linux/amd64, linux/arm64)
      #   - Inline cache export/import for layer reuse across builds
      #   - Build attestation for supply chain security (SLSA)
      # -----------------------------------------------------------------------
      - name: "⚙️ Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # STEP 4: Extract Metadata for Tagging
      # Generates standardized OCI labels and tags. The docker/metadata-action
      # produces both the `latest` tag and the commit SHA tag automatically,
      # following the OCI image specification.
      # -----------------------------------------------------------------------
      - name: "🏷️ Extract Docker Metadata (Tags & Labels)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Mutable convenience tag — points to the most recent main build.
            # WARNING: Never reference `latest` in production K8s manifests.
            type=raw,value=latest
            # Immutable tag — short SHA enables exact commit traceability.
            # Use this tag for production deployments and rollbacks.
            type=sha,prefix=,format=short

      # -----------------------------------------------------------------------
      # STEP 5: Build & Push Multi-Stage Docker Image
      # The multi-stage Dockerfile separates build-time deps from runtime,
      # producing a minimal production image (~150MB vs ~800MB naive build).
      #
      # Cache Strategy:
      #   - GitHub Actions cache backend (type=gha) stores Docker layers
      #     between runs. Subsequent builds only rebuild changed layers,
      #     reducing build time from ~3min to ~30sec for incremental changes.
      #
      # Provenance & SBOM:
      #   - provenance=true generates a signed build attestation (SLSA Level 1)
      #     for supply chain security audits.
      # -----------------------------------------------------------------------
      - name: "🚀 Build & Push Docker Image to GHCR"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      # -----------------------------------------------------------------------
      # STEP 6: Post-Build Summary
      # Outputs the pushed image tags to the GitHub Actions summary page for
      # quick reference. Useful for deployment engineers verifying which SHA
      # is currently in the registry.
      # -----------------------------------------------------------------------
      - name: "📋 Pipeline Summary"
        run: |
          echo "## 🚀 VibeSync API — Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "kubectl set image deployment/vibesync-api vibesync-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 3: BUILD FRONTEND — Generate HTML Artifacts
  # ===========================================================================
  build-frontend:
    name: "🌐 Build Frontend — HTML Artifacts"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "⚙️ Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: streamops/frontend/package-lock.json

      - name: "📦 Install dependencies"
        working-directory: streamops/frontend
        run: npm ci

      - name: "🏗️ Build React App"
        working-directory: streamops/frontend
        run: npm run build

      - name: "📤 Upload Frontend Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-html-build
          path: streamops/frontend/dist/
          retention-days: 14

  # ===========================================================================
  # JOB 4: BUILD & PUSH PER-SERVICE IMAGES
  # ===========================================================================
  # Purpose: Build each microservice's dedicated multi-stage Dockerfile and
  # push 3 independent images to GHCR. This replaces the monolithic root
  # Dockerfile approach — each service gets its own immutable artifact.
  #
  # The per-service Dockerfiles (target: runtime) already contain:
  #   Stage 1 (deps)    → pip install into isolated prefix
  #   Stage 2 (test)    → flake8 + pytest gate (skipped here; tests run in quality-gate)
  #   Stage 3 (runtime) → non-root user, HEALTHCHECK, uvicorn CMD
  #
  # Matrix Strategy: Builds all 3 services in parallel on separate runners.
  # ===========================================================================
  build-services:
    name: "🐳 Build ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: stream-service
            image: vibesync-stream
            context: streamops/services/stream-service
          - service: user-service
            image: vibesync-user
            context: streamops/services/user-service
          - service: content-service
            image: vibesync-content
            context: streamops/services/content-service

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔐 Authenticate to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "⚙️ Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🏷️ Extract Docker Metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # -----------------------------------------------------------------------
      # Build the per-service Dockerfile targeting the 'runtime' stage.
      # The 'test' stage is intentionally skipped — quality-gate already
      # ran pylint + pytest. Building target=runtime avoids redundant test
      # execution and keeps build times minimal.
      # -----------------------------------------------------------------------
      - name: "🚀 Build & Push — ${{ matrix.service }}"
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true

      - name: "📋 Image Summary"
        run: |
          echo "## 🐳 ${{ matrix.service }} — Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ matrix.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 5: DEPLOY TO KUBERNETES
  # ===========================================================================
  # Purpose: Apply all Kubernetes manifests and verify rollout status.
  # Runs only after all 3 per-service images are built and pushed.
  #
  # Requires: KUBECONFIG secret containing the cluster kubeconfig.
  # For Minikube: run this step manually with `kubectl apply --recursive`.
  # ===========================================================================
  deploy-to-k8s:
    name: "☸️ Deploy to Kubernetes"
    runs-on: ubuntu-latest
    needs: [build-services]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Inject the immutable SHA tag into all deployment manifests.
      # Replaces :latest with the exact commit SHA so K8s pulls the image
      # that was just built, not a cached :latest from a previous run.
      # -----------------------------------------------------------------------
      - name: "🏷️ Patch Image Tags with Commit SHA"
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Patching image tags to :${SHORT_SHA}"
          sed -i "s|ghcr.io/soumitra-04/vibesync-stream:latest|ghcr.io/soumitra-04/vibesync-stream:${SHORT_SHA}|g" kubernetes/stream-service/deployment.yaml
          sed -i "s|ghcr.io/soumitra-04/vibesync-user:latest|ghcr.io/soumitra-04/vibesync-user:${SHORT_SHA}|g" kubernetes/user-service/deployment.yaml
          sed -i "s|ghcr.io/soumitra-04/vibesync-content:latest|ghcr.io/soumitra-04/vibesync-content:${SHORT_SHA}|g" kubernetes/content-service/deployment.yaml
          echo "✅ All deployment manifests patched."

      # -----------------------------------------------------------------------
      # Check if KUBECONFIG secret is provided. If not, we skip the cluster
      # deployment steps. This prevents pipeline failures for users testing
      # with local Minikube who haven't set up GitHub Secrets.
      # -----------------------------------------------------------------------
      - name: "☸️ Check for Kubeconfig Secret"
        id: check-kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_SECRET" ]; then
            echo "No KUBECONFIG secret found. Skipping cluster deployment."
            echo "has_secret=false" >> $GITHUB_OUTPUT
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # Set up kubectl with the cluster kubeconfig from GitHub Secrets.
      # For local Minikube testing, skip this job and run manually:
      #   kubectl apply --recursive -f kubernetes/
      # -----------------------------------------------------------------------
      - name: "☸️ Set up Kubeconfig"
        if: steps.check-kubeconfig.outputs.has_secret == 'true'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # -----------------------------------------------------------------------
      # Dry-run validation: Ensures all manifests parse correctly before
      # applying to the live cluster. Catches YAML syntax errors, missing
      # fields, and invalid API versions.
      # --validate=false skips OpenAPI schema download, allowing this to run
      # fully client-side even if KUBECONFIG is missing.
      # -----------------------------------------------------------------------
      - name: "🔍 Validate Manifests (Dry Run)"
        run: |
          echo "Running kubectl dry-run validation..."
          kubectl apply --recursive -f kubernetes/ --dry-run=client --validate=false
          echo "✅ All manifests validated successfully."

      - name: "🚀 Apply Kubernetes Manifests"
        if: steps.check-kubeconfig.outputs.has_secret == 'true'
        run: |
          kubectl apply --recursive -f kubernetes/
          echo "✅ All manifests applied."

      # -----------------------------------------------------------------------
      # Wait for each deployment to complete its rollout. This ensures the
      # pipeline fails if any pod fails to start (e.g., image pull error,
      # crash loop, failed health check).
      # -----------------------------------------------------------------------
      - name: "⏳ Verify Rollout Status"
        if: steps.check-kubeconfig.outputs.has_secret == 'true'
        run: |
          echo "::group::PostgreSQL Rollout"
          kubectl rollout status deployment/postgres -n vibesync --timeout=120s
          echo "::endgroup::"

          echo "::group::Stream Service Rollout"
          kubectl rollout status deployment/stream-service -n vibesync --timeout=120s
          echo "::endgroup::"

          echo "::group::User Service Rollout"
          kubectl rollout status deployment/user-service -n vibesync --timeout=120s
          echo "::endgroup::"

          echo "::group::Content Service Rollout"
          kubectl rollout status deployment/content-service -n vibesync --timeout=120s
          echo "::endgroup::"

          echo "✅ All deployments rolled out successfully."

      - name: "📋 Deployment Summary"
        run: |
          echo "## ☸️ VibeSync — Kubernetes Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-kubeconfig.outputs.has_secret }}" == 'true' ]; then
            echo "| postgres | ✅ Rolled out |" >> $GITHUB_STEP_SUMMARY
            echo "| stream-service | ✅ Rolled out |" >> $GITHUB_STEP_SUMMARY
            echo "| user-service | ✅ Rolled out |" >> $GITHUB_STEP_SUMMARY
            echo "| content-service | ✅ Rolled out |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Rollback Commands" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "kubectl rollout undo deployment/stream-service -n vibesync" >> $GITHUB_STEP_SUMMARY
            echo "kubectl rollout undo deployment/user-service -n vibesync" >> $GITHUB_STEP_SUMMARY
            echo "kubectl rollout undo deployment/content-service -n vibesync" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "| All Deployments | ⚠️ Skipped (No KUBECONFIG secret) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Manual Deployment Required" >> $GITHUB_STEP_SUMMARY
            echo "No \`KUBECONFIG\` secret was found in GitHub, so the cluster deployment was skipped." >> $GITHUB_STEP_SUMMARY
            echo "To deploy manually (e.g., using Minikube):" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "kubectl apply --recursive -f kubernetes/" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Manual Dry-Run Validation" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "kubectl apply --recursive -f kubernetes/ --dry-run=client" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
